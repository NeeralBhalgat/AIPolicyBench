name = "aipolicybench_green_agent"
description = "Assessment manager for evaluating RAG agents on AI safety and policy questions."
version = "1.0.0"

defaultInputModes = ["text"]
defaultOutputModes = ["text"]

[capabilities]
streaming = false

[[skills]]
id = "rag_assessment"
name = "RAG Agent Assessment"
description = """
Evaluates RAG agents using predefined queries with ground truth answers.
Tests the agent's ability to correctly answer questions about AI safety and policy datasets.
Provides detailed evaluation metrics including correctness, hallucination rate, and factuality.

Default configuration:
- Uses LLM-as-a-judge (GPT-4o-mini) for accurate evaluation
- Evaluates all queries (full dataset) by default
- Timeout: 120 seconds per request
- Automatically fixes common URL issues (double slashes)

Simply provide the white_agent_url and the assessment will run automatically.
"""
tags = ["green agent", "assessment", "evaluation", "rag", "benchmarking", "llm-judge", "model:gpt-4o-mini"]
examples = [
"""
Your task is to assess the agents located at:
<white_agent_url>
https://example.com/to_agent/abc123
</white_agent_url>
""",
"""
Your task is to assess the agents located at:
<white_agent_url>
http://localhost:9002
</white_agent_url>
<max_queries>
5
</max_queries>
"""
]
